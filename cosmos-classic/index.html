/* ---------- Speichern ---------- */
function save() { try { localStorage.setItem('cosmos', JSON.stringify({ w: S.world, bpm: S.bpm, p: S.pulse, s: S.strings.map(s => [s.x1 / W, s.y1 / H, s.x2 / W, s.y2 / H, s.inst]), po: S.portals.map(p => [p.x / W, p.y / H, p.r / Math.min(W, H)]) })); } catch (e) {} }

/* ---------- Zeichnen ---------- */
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
function draw(dt) {

    g.fillStyle = hsl(p.h, 100, 85); g.font = '700 12px system-ui'; g.textAlign = 'center'; g.fillText(n > 1 ? (i + 1) + ' → ' + ((i + 1) % n + 1) : 'Loch', p.x, p.y + 4); });

    const inst = IM[s.inst]; s.wob *= 0.93; const mx = (s.x1 + s.x2) / 2, my = (s.y1 + s.y2) / 2, nx = -(s.y2 - s.y1) / s.len, ny = (s.x2 - s.x1) / s.len, amp = s.wob * 12 * Math.sin(performance.now() / 22);

    g.beginPath(); g.moveTo(s.x1, s.y1); g.quadraticCurveTo(mx + nx * amp, my + ny * amp, s.x2, s.y2); g.stroke(); g.shadowBlur = 0;
    if (s.wob > 0.08 && s.name) { g.fillStyle = hsl(inst.h, 100, 85, s.wob); g.font = '700 13px system-ui'; g.textAlign = 'center'; g.fillText(s.name, mx + nx * 18, my + ny * 18); }
    else { g.fillStyle = hsl(inst.h, 80, 70, 0.8); g.font = '14px system-ui'; g.textAlign = 'center'; g.fillText(inst.e, s.x1, s.y1 - 9); }
  });
  // Vorschau
  if (gest && gest.mode === 'draw' && S.tool !== 'erase') { const inst = IM[S.tool]; g.strokeStyle = hsl(inst.h, 90, 70, 0.7); g.setLineDash([6, 6]); g.lineWidth = 3; g.beginPath(); g.moveTo(gest.x0, gest.y0); g.lineTo(gest.x, gest.y); g.stroke(); g.setLineDash([]);
    const L = Math.hypot(gest.x - gest.x0, gest.y - gest.y0), dg = degOf(L); g.fillStyle = '#fff'; g.font = '700 14px system-ui'; g.textAlign = 'center'; const s0 = sc(); g.fillText(inst.k === 'drum' ? inst.n : NOTE_NAMES[(s0.rs + s0.notes[((dg % 7) + 7) % 7]) % 12], (gest.x + gest.x0) / 2, (gest.y + gest.y0) / 2 - 12); }
  // Dirigent-Brunnen
  if (S.well) { const t = performance.now() / 300; for (let i = 0; i < 3; i++) { g.strokeStyle = hsl(w.hue, 90, 70, 0.5 - i * 0.14); g.lineWidth = 2; g.beginPath(); g.arc(S.well.x, S.well.y, 20 + ((t + i) % 3) * 40 * (1 - 0), 0, 7); g.stroke(); } g.fillStyle = '#fff'; g.beginPath(); g.arc(S.well.x, S.well.y, 6, 0, 7); g.fill(); }

  g.fillStyle = '#cfd6e6'; g.font = '600 12px system-ui'; g.fillText(`${sc().name} · ${Math.round(S.bpm)} BPM`, 12, 40);

    g.font = '600 ' + Math.max(8, Math.round(d.w * 0.18)) + 'px system-ui'; g.fillStyle = on ? '#fff' : '#9aa5bb'; g.fillText(d.n, d.x + d.w / 2, d.y + d.h - 7);

  S.toasts = S.toasts.filter(t => t.a < 3.2); S.toasts.forEach((t, i) => { const al = Math.min(1, (3.2 - t.a) * 1.5); g.font = '700 14px system-ui'; g.textAlign = 'center'; const tw = g.measureText(t.t).width + 28; g.fillStyle = `rgba(0,0,0,${0.6 * al})`; rr(W / 2 - tw / 2, 56 + i * 34, tw, 28, 14); g.fill(); g.fillStyle = `rgba(255,255,255,${al})`; g.fillText(t.t, W / 2, 75 + i * 34); });
  if (S.hint < 3 && S.started && !S.toasts.length) { g.fillStyle = 'rgba(255,255,255,0.55)'; g.textAlign = 'center'; g.font = '600 13px system-ui'; if (W < 640) { g.fillText('Ziehen = Saite · Kreis = Portal · Tippen = Kugel', W / 2, ph - 30); g.fillText('Halten = Dirigent (zieht Kugeln an)', W / 2, ph - 12); } else g.fillText('Ziehen = Saite · Kreis = Portal · Tippen = Kugel · Halten = Dirigent (zieht die Kugeln an)', W / 2, ph - 14); }

}
function drawBpm() {
  const x = W - 12; g.textAlign = 'right'; g.font = '800 13px system-ui'; g.fillStyle = '#cfd6e6'; g.fillText('− BPM +', x, 40); S.bpmBox = { x: x - 70, y: 26, w: 70, h: 20 };
}
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

/* ---------- Start ---------- */
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; g.setTransform(DPR, 0, 0, DPR, 0, 0); layoutDock(); }
let lastF = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastF) / 1000); lastF = now;

  requestAnimationFrame(loop);
  window.__cosmos = { S, get ctx() { return ctx; }, get bus() { return bus; } };

});
